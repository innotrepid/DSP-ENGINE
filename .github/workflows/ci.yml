name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_TESTS=ON \
            -DDSP_BUILD_EXAMPLES=ON \
            -DDSP_BACKEND_AAUDIO=OFF \
            -DDSP_BACKEND_WASAPI=OFF \
            -DDSP_BACKEND_COREAUDIO=OFF
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Benchmarks
        run: ./build/tests/benchmarks

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_TESTS=ON \
            -DDSP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Benchmarks
        run: ./build/tests/benchmarks

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DDSP_BUILD_TESTS=ON `
            -DDSP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release -j
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmarks
        run: .\build\tests\Release\benchmarks.exe

  build-android:
    name: Build (Android NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Configure (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_TESTS=OFF \
            -DDSP_BUILD_EXAMPLES=OFF \
            -DDSP_BACKEND_AAUDIO=ON \
            -DDSP_BACKEND_WASAPI=OFF \
            -DDSP_BACKEND_COREAUDIO=OFF
      - name: Build
        run: cmake --build build-android -j$(nproc)
