name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # Primary target for now: native library used by Flutter Android (Resonate)
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDSP_BUILD_EXAMPLES=ON \
            -DDSP_BUILD_TESTS=OFF \
            -DDSP_ENABLE_SIMD=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run offline example
        run: |
          set -e
          bin=$(find build -name dsp_example_offline -type f -executable | head -1)
          test -n "$bin"
          "$bin"

  # Cross-compile arm64 + armv7 shared libs for Android (NDK)
  build-android:
    name: Build (Android NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          ABI=arm64-v8a
          cmake -B build-android-$ABI \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_EXAMPLES=OFF \
            -DDSP_BUILD_TESTS=OFF \
            -DDSP_ENABLE_SIMD=OFF \
            -DDSP_BUILD_SHARED=ON
          cmake --build build-android-$ABI --parallel
          mkdir -p dist/android/$ABI
          find build-android-$ABI -name 'libdsp_engine.so' -exec cp {} dist/android/$ABI/ \;
          test -f dist/android/$ABI/libdsp_engine.so
          echo "Built dist/android/$ABI/libdsp_engine.so"
          ls -la dist/android/$ABI/

      - name: Build armeabi-v7a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          ABI=armeabi-v7a
          cmake -B build-android-$ABI \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_EXAMPLES=OFF \
            -DDSP_BUILD_TESTS=OFF \
            -DDSP_ENABLE_SIMD=OFF \
            -DDSP_BUILD_SHARED=ON
          cmake --build build-android-$ABI --parallel
          mkdir -p dist/android/$ABI
          find build-android-$ABI -name 'libdsp_engine.so' -exec cp {} dist/android/$ABI/ \;
          test -f dist/android/$ABI/libdsp_engine.so
          ls -la dist/android/$ABI/

      - name: Upload Android .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libdsp_engine-android
          path: dist/android/

  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: build-linux
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DDSP_BUILD_EXAMPLES=OFF \
            -DDSP_ENABLE_SIMD=OFF
      - name: clang-tidy (non-blocking)
        continue-on-error: true
        run: find src -name '*.cpp' | xargs -r clang-tidy -p build --quiet || true
