name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_TESTS=ON \
            -DDSP_BUILD_EXAMPLES=ON \
            -DDSP_BACKEND_AAUDIO=OFF \
            -DDSP_BACKEND_WASAPI=OFF \
            -DDSP_BACKEND_COREAUDIO=OFF
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Benchmarks
        run: ./build/tests/benchmarks
      - name: Example
        run: ./build/examples/dsp_example_offline

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_TESTS=ON \
            -DDSP_BUILD_EXAMPLES=ON \
            -DDSP_BACKEND_AAUDIO=OFF \
            -DDSP_BACKEND_WASAPI=OFF \
            -DDSP_BACKEND_COREAUDIO=ON
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Benchmarks
        run: ./build/tests/benchmarks
      - name: Example
        run: ./build/examples/dsp_example_offline

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -A x64 `
            -DDSP_BUILD_TESTS=ON `
            -DDSP_BUILD_EXAMPLES=ON `
            -DDSP_BACKEND_AAUDIO=OFF `
            -DDSP_BACKEND_WASAPI=ON `
            -DDSP_BACKEND_COREAUDIO=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        timeout-minutes: 2
        shell: pwsh
        run: |
          # Shared DLL: build/Release; tests: build/tests/Release.
          # POST_BUILD copies DLL next to the exe; PATH is a belt-and-suspenders.
          $dllDir = Join-Path $PWD "build\Release"
          $testDir = Join-Path $PWD "build\tests\Release"
          $env:PATH = "$testDir;$dllDir;$env:PATH"
          if (Test-Path "$testDir\unit_tests.exe") {
            & "$testDir\unit_tests.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            ctest --test-dir build -C Release --output-on-failure --timeout 30
          }
      - name: Benchmarks
        timeout-minutes: 2
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $PWD 'build\tests\Release');$(Join-Path $PWD 'build\Release');$env:PATH"
          & ".\build\tests\Release\benchmarks.exe"
      - name: Example
        shell: pwsh
        run: |
          $env:PATH = "$(Join-Path $PWD 'build\examples\Release');$(Join-Path $PWD 'build\Release');$env:PATH"
          & ".\build\examples\Release\dsp_example_offline.exe"

  build-android:
    name: Build (Android NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Configure (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP_BUILD_TESTS=OFF \
            -DDSP_BUILD_EXAMPLES=OFF \
            -DDSP_BACKEND_AAUDIO=ON \
            -DDSP_BACKEND_WASAPI=OFF \
            -DDSP_BACKEND_COREAUDIO=OFF
      - name: Build
        run: cmake --build build-android -j$(nproc)
