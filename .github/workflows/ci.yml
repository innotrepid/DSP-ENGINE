name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-latest
            cmake_extra: "-DDSP_ENABLE_SIMD=ON"
          - os: windows-latest
            cmake_extra: "-DDSP_ENABLE_SIMD=ON"
          - os: macos-latest
            cmake_extra: "-DDSP_ENABLE_SIMD=ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDSP_BUILD_EXAMPLES=ON \
            -DDSP_BUILD_TESTS=OFF \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run offline example
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./build/${{ matrix.build_type }}/examples/dsp_example_offline.exe || \
            ./build/examples/${{ matrix.build_type }}/dsp_example_offline.exe || \
            ./build/examples/dsp_example_offline.exe
          else
            ./build/examples/dsp_example_offline
          fi

  # Optional: static analysis (Linux only)
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure with compile_commands
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DDSP_BUILD_EXAMPLES=OFF

      - name: Run clang-tidy (non-blocking)
        continue-on-error: true
        run: |
          find src -name '*.cpp' | xargs -r clang-tidy -p build --quiet || true
