group 'com.aetherion.dsp_engine'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.aetherion.dsp_engine'
    compileSdk 34

    defaultConfig {
        minSdk 24

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -fPIC'
                arguments '-DDSP_BUILD_EXAMPLES=OFF',
                          '-DDSP_BUILD_TESTS=OFF',
                          '-DDSP_ENABLE_SIMD=OFF',
                          '-DDSP_BUILD_SHARED=ON',
                          '-DDSP_BUILD_STATIC=OFF',
                          '-DANDROID_STL=c++_shared'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../../../CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Plugin library namespace only.
// Host app (Resonate): com.aetherion.resonate / com.Aetherion.Resonate
