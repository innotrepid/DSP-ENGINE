group 'com.example.dsp_engine'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.dsp_engine'
    compileSdk 34

    defaultConfig {
        minSdk 26   // AAudio requires API 26+
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -ffast-math'
                arguments '-DDSP_BACKEND_AAUDIO=ON',
                          '-DDSP_BUILD_SHARED=ON',
                          '-DDSP_BUILD_STATIC=OFF',
                          '-DDSP_BUILD_TESTS=OFF',
                          '-DDSP_BUILD_EXAMPLES=OFF'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
